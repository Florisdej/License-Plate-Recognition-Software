<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALPR — RPi4 Dashboard</title>
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
  <header>
    <div class="header-left">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect x="1" y="6" width="26" height="16" rx="3" stroke="#00d4ff" stroke-width="2"/>
          <rect x="5" y="10" width="18" height="8" rx="1" fill="none" stroke="#00d4ff" stroke-width="1.5"/>
          <rect x="8" y="12" width="4" height="4" rx="0.5" fill="#00d4ff"/>
          <rect x="16" y="12" width="4" height="4" rx="0.5" fill="#00d4ff"/>
        </svg>
        <span>ALPR</span>
      </div>
      <span class="subtitle">Raspberry Pi 4 &mdash; License Plate Recognition</span>
    </div>
    <div class="header-right">
      <div class="status-pill" id="connection-badge">
        <span class="dot"></span>
        <span id="connection-label">Connecting…</span>
      </div>
    </div>
  </header>

  <main>
    <!-- Stats row -->
    <section class="stats-row">
      <div class="stat-card">
        <div class="stat-value" id="stat-fps">—</div>
        <div class="stat-label">FPS</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-total">—</div>
        <div class="stat-label">Total Detections</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-uptime">—</div>
        <div class="stat-label">Uptime</div>
      </div>
      <div class="stat-card highlight">
        <div class="stat-value" id="stat-last-plate">—</div>
        <div class="stat-label">Last Plate</div>
      </div>
    </section>

    <!-- Stream + history -->
    <section class="content-row">
      <div class="card stream-card">
        <div class="card-header">
          <h2>Live Stream</h2>
          <span class="tag" id="stream-tag">LIVE</span>
        </div>
        <div class="stream-wrapper">
          <img id="stream-img" src="/stream" alt="Live feed" onerror="handleStreamError()">
          <div id="stream-overlay" class="stream-overlay hidden">
            <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
              <circle cx="20" cy="20" r="18" stroke="#666" stroke-width="2"/>
              <line x1="12" y1="12" x2="28" y2="28" stroke="#666" stroke-width="2"/>
            </svg>
            <span>No signal</span>
          </div>
        </div>
      </div>

      <div class="card history-card">
        <div class="card-header">
          <h2>Detection History</h2>
          <button class="btn-clear" id="btn-clear" onclick="clearHistory()">Clear</button>
        </div>
        <div class="table-wrapper">
          <table id="history-table">
            <thead>
              <tr>
                <th>Plate</th>
                <th>Color</th>
                <th>Det.</th>
                <th>OCR</th>
                <th>Time</th>
              </tr>
            </thead>
            <tbody id="history-body">
              <tr class="empty-row">
                <td colspan="5">No detections yet</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- Chart row -->
    <section class="content-row">
      <div class="card chart-card">
        <div class="card-header">
          <h2>Detection Rate</h2>
          <span class="tag tag-dim" id="chart-window">last 20</span>
        </div>
        <canvas id="rate-chart" height="120"></canvas>
      </div>
      <div class="card plates-card">
        <div class="card-header">
          <h2>Unique Plates</h2>
          <span class="tag tag-dim" id="unique-count">0</span>
        </div>
        <div id="unique-plates" class="plate-cloud"></div>
      </div>
    </section>
  </main>

  <footer>
    <span>ALPR RPi4 &mdash; refresh interval: <span id="interval-label">2s</span></span>
    <div class="footer-controls">
      <label>
        Interval
        <select id="interval-select" onchange="setInterval_(this.value)">
          <option value="1000">1s</option>
          <option value="2000" selected>2s</option>
          <option value="5000">5s</option>
          <option value="10000">10s</option>
        </select>
      </label>
    </div>
  </footer>

  <script src="static/js/app.js"></script>
</body>
</html>
